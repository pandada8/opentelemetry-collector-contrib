type: object
properties:
  access_key_id:
    description: AlibabaCloud access key id
    type: string
  access_key_secret:
    description: AlibabaCloud access key secret
    $ref: go.opentelemetry.io/collector/config/configopaque.string
  ecs_ram_role:
    description: Set AlibabaCLoud ECS ram role if you are using ACK
    type: string
  endpoint:
    description: LogService's Endpoint, https://www.alibabacloud.com/help/doc-detail/29008.htm for AlibabaCloud Kubernetes(or ECS), set {region-id}-intranet.log.aliyuncs.com, eg cn-hangzhou-intranet.log.aliyuncs.com; others set {region-id}.log.aliyuncs.com, eg cn-hangzhou.log.aliyuncs.com
    type: string
  logstore:
    description: LogService's Logstore Name
    type: string
  project:
    description: LogService's Project Name
    type: string
  security_token:
    description: AlibabaCloud security token for STS credentials
    $ref: go.opentelemetry.io/collector/config/configopaque.string
  token_file_path:
    description: Set Token File Path if you are using ACK
    type: string
  trace_format:
    description: 'Trace output format: empty or "legacy" for the original SLS format, or "xtrace" for logstore-tracing.'
    type: string
  trace_pid:
    description: XTrace application identifier to emit as pid. This is not an OS process ID.
    type: string
  trace_pid_by_service:
    description: XTrace application identifiers keyed by exact resource service.name; overrides trace_pid.
    type: object
    additionalProperties:
      type: string
  trace_pid_auto_discovery:
    description: Enable startup and hourly discovery of XTrace PIDs from SLS.
    type: boolean
  trace_pid_discovery_project:
    description: Optional discovery source project; defaults to project.
    type: string
  trace_pid_discovery_logstore:
    description: Optional discovery source logstore; defaults to logstore.
    type: string
